<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Badge Checker</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .true { color: green; }
        .false { color: red; }
    </style>
</head>
<body>

<h2>Upload CSV files</h2>

<form method="post" action="/run" enctype="multipart/form-data">
    Usernames CSV:
    <input type="file" name="usernames" required><br><br>
    Badges CSV:
    <input type="file" name="badges" required><br><br>
    <button type="submit">Run</button>
</form>

<hr>

<div th:if="${results}">
    <div th:each="user : ${results}" class="card">
        <h3 th:text="${user.username}"></h3>

        <ul>
            <li th:each="b : ${user.badges}">
                <span th:text="${b.badge}"></span> :
                <span th:text="${b.completed}"
                      th:class="${b.completed}"></span>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
